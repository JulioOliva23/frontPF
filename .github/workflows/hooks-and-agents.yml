# Runs the same checks as the local Git hook and validates the subagents,
# publishing a readable report in each run's summary (Actions → run → Summary).
name: Hooks & Subagents

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-hooks:
    name: Git hook (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # Manual run or first push: check everything.
            echo "ref=ALL" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pre-commit hook
        env:
          HOOK_BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          set -o pipefail
          ./scripts/hooks/hook-pre-commit.sh 2>&1 | tee hook.log

      - name: Test report
        if: always()
        run: |
          set -o pipefail
          npx vitest run --reporter=verbose 2>&1 | tee tests.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🪝 Git hook (pre-commit)"
            echo "Base: \`${{ steps.base.outputs.ref }}\`"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' hook.log 2>/dev/null || echo "(no output)"
            echo '```'
            echo "## 🧪 Tests (Vitest)"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' tests.log 2>/dev/null | grep -E '✓|×|Test Files|Tests ' || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  subagents:
    name: Subagents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate .ai/agents
        run: |
          set -o pipefail
          {
            echo "## 🤖 Subagents"
            ./scripts/hooks/check-agents.sh
          } | tee -a "$GITHUB_STEP_SUMMARY"
